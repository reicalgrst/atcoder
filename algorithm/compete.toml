# Path to the test file (Liquid template)
#
# Variables:
#
# - `manifest_dir`: Package directory
# - `contest`:      Contest ID (e.g. "abc100")
# - `bin_name`:     Name of a `bin` target (e.g. "abc100-a")
# - `bin_alias`:    "Alias" for a `bin` target defined in `pacakge.metadata.cargo-compete` (e.g. "a")
# - `problem`:      Alias for `bin_alias` (deprecated)
#
# Additional filters:
#
# - `kebabcase`: Convert to kebab case (by using the `heck` crate)
test-suite = "{{ manifest_dir }}/testcases/{{ bin_alias }}.yml"

# Open files with the command (`jq` command that outputs `string[] | string[][]`)
#
# VSCode:
#open = '[["code", "-a", .manifest_dir], ["code"] + (.paths | map([.src, .test_suite]) | flatten)]'
# Emacs:
#open = '["emacsclient", "-n"] + (.paths | map([.src, .test_suite]) | flatten)'

[template]
src = '''
#![allow(non_snake_case)]
use proconio::*;

// https://maguro.dev/blog/debug-macro/
#[allow(unused_macros)]
macro_rules! debug {
    ($($a:expr),* $(,)*) => {
        #[cfg(debug_assertions)]
        eprintln!(concat!($("| ", stringify!($a), " = {:?} "),*, "|"), $(&$a),*);
    };
}

fn main() {
    input! {
    
    }
}
'''

[template.new]
# `edition` for `Cargo.toml`.
edition = "2024"
# `profile` for `Cargo.toml`.
#
# By setting this, you can run tests with `opt-level=3` while enabling `debug-assertions` and `overflow-checks`.
#profile = '''
#[dev]
#opt-level = 3
#'''
dependencies = '''
proconio = { version = "=0.5.0", features = ["derive"] }
itertools = "=0.14.0"
itertools-num = "=0.1.3"
superslice = "=1.0.0"
either = "=1.15.0"
ac-library-rs = "=0.2.0"
counter = "=0.7.0"
im-rc = "=15.1.0"
rpds = "=1.1.1"
rustc-hash = "=2.1.1"
indexmap = "=2.11.0"
bitvec = "=1.0.1"
fixedbitset = "=0.5.7"
bitset-fixed = "=0.1.0"
regex = "=1.11.2"
petgraph = "=0.8.2"
pathfinding = "=4.14.0"
varisat = "=0.2.2"
primal = "=0.3.3"
num = "=0.4.3"
ordered-float = "=5.0.0"
ndarray = "=0.16.1"
nalgebra = "=0.34.0"
amplify_num = { version = "=0.5.3", features = ["std"] }
rand = "=0.9.2"
rand_pcg = "=0.9.0"
rand_distr = "=0.5.1"
memoise = "=0.3.2"
recur-fn = "=2.2.0"
once_cell = "=1.21.3"
thiserror = "=2.0.16"
'''
dev-dependencies = '''
#atcoder-202004-lock = { git = "https://github.com/qryxip/atcoder-202004-lock" }
'''

[template.new.copy-files]
"./template-cargo-lock.toml" = "Cargo.lock"

[new]
kind = "cargo-compete"
# Platform
#
# - atcoder
# - codeforces
# - yukicoder
platform = "atcoder"
# Path (Liquid template)
#
# Variables:
#
# - `contest`:      Contest ID. **May be nil**
# - `contest_path`: Grouped contest path. For AtCoder, e.g. "abc/200-299/abc213"
# - `package_name`: Package name
path = "./contests/{{ contest_path }}"

#[new]
#kind = "oj-api"
#url = "https://atcoder.jp/contests/{{ id }}"
#path = "./{{ contest }}"

