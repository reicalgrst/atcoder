---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 4 6
      3 5 7 5 3
    out: |
      1
  - name: sample2
    in: |
      10 3 8
      1 5 6 4 7 2 10 3 8 1
    out: |
      4
  - name: sample3
    in: |
      20 10 50
      5 15 20 60 30 25 10 70 40 35 8 12 45 3 50 10 55 20 30 100
    out: |
      8

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
