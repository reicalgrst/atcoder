---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 3 3
      1 2 0 1 3
      1 3
      2 4
      1 5
    out: |
      5
  - name: sample2
    in: |
      8 4 5
      3 1 4 0 2 5 1 0
      1 4
      3 6
      2 5
      6 8
    out: |
      2
  - name: sample3
    in: |
      10 5 1000000000
      999999999 0 999999998 500000000 0 1000000000 999999997 0 999999999 0
      1 3
      1 1
      6 7
      7 10
      3 9
    out: |
      5

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
