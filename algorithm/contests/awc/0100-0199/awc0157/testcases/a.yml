---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5
      2 1 1 2 3
    out: |
      2
  - name: sample2
    in: |
      8
      2 3 4 5 6 7 8 1
    out: |
      0
  - name: sample3
    in: |
      10
      3 1 1 1 3 7 8 7 10 9
    out: |
      4

extend:
  - type: Text
    path: "./a"
    in: /in/*.txt
    out: /out/*.txt
