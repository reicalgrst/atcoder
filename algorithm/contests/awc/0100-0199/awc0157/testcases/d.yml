---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      3 2
      1 2 3
      4 5
    out: |
      Yes
  - name: sample2
    in: |
      4 5
      3 1 4 2
      5 6 4 7 3
    out: |
      Yes
  - name: sample3
    in: |
      5 3
      10 20 30 40 50
      25 35 45
    out: |
      No

extend:
  - type: Text
    path: "./d"
    in: /in/*.txt
    out: /out/*.txt
