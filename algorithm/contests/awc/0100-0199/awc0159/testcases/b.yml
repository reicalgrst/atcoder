---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 2
      1 3 5 7 9
    out: |
      4
  - name: sample2
    in: |
      7 3
      1 4 7 10 2 5 8
    out: |
      5
  - name: sample3
    in: |
      10 100
      50 150 250 350 450 200 300 400 500 600
    out: |
      8

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
