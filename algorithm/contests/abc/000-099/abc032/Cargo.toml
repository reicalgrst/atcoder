[package]
name = "abc032"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-compete.bin]
abc032-a = { alias = "a", problem = "https://atcoder.jp/contests/abc032/tasks/abc032_a" }
abc032-b = { alias = "b", problem = "https://atcoder.jp/contests/abc032/tasks/abc032_b" }
abc032-c = { alias = "c", problem = "https://atcoder.jp/contests/abc032/tasks/abc032_c" }
abc032-d = { alias = "d", problem = "https://atcoder.jp/contests/abc032/tasks/abc032_d" }

[[bin]]
name = "abc032-a"
path = "src/bin/a.rs"

[[bin]]
name = "abc032-b"
path = "src/bin/b.rs"

[[bin]]
name = "abc032-c"
path = "src/bin/c.rs"

[[bin]]
name = "abc032-d"
path = "src/bin/d.rs"

[dependencies]
proconio = { version = "=0.5.0", features = ["derive"] }
itertools = "=0.14.0"
itertools-num = "=0.1.3"
superslice = "=1.0.0"
either = "=1.15.0"
ac-library-rs = "=0.2.0"
counter = "=0.7.0"
im-rc = "=15.1.0"
rpds = "=1.1.1"
rustc-hash = "=2.1.1"
indexmap = "=2.11.0"
bitvec = "=1.0.1"
fixedbitset = "=0.5.7"
bitset-fixed = "=0.1.0"
regex = "=1.11.2"
petgraph = "=0.8.2"
pathfinding = "=4.14.0"
varisat = "=0.2.2"
primal = "=0.3.3"
num = "=0.4.3"
ordered-float = "=5.0.0"
ndarray = "=0.16.1"
nalgebra = "=0.34.0"
amplify_num = { version = "=0.5.3", features = ["std"] }
rand = "=0.9.2"
rand_pcg = "=0.9.0"
rand_distr = "=0.5.1"
memoise = "=0.3.2"
recur-fn = "=2.2.0"
once_cell = "=1.21.3"
thiserror = "=2.0.16"

[dev-dependencies]
